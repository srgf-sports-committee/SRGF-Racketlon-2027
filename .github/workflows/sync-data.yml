name: Sync SRGF data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

# Prevent two copies of this workflow from pushing at the same time.
concurrency:
  group: srgf-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download and validate current tournament data
        env:
          API_URL: "https://script.google.com/macros/s/AKfycbw_KN0QUEsck_ChkjZ3HAS82Xj9aVb9R6UBYJzoh26MSE-ydTJjVjUzn6vFXG3WQlFJsg/exec"
        run: |
          set -e

          # Make absolutely sure we start from the current remote main.
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          from datetime import datetime, timezone

          api = os.environ["API_URL"] + "?action=data&t=" + str(time.time_ns())
          req = urllib.request.Request(
              api,
              headers={"User-Agent": "SRGF-Racketlon-Data-Sync/1.0"}
          )

          with urllib.request.urlopen(req, timeout=45) as response:
              if response.status != 200:
                  raise RuntimeError(f"Apps Script HTTP {response.status}")
              payload = json.load(response)

          if not isinstance(payload, dict) or payload.get("ok") is False:
              raise RuntimeError("Apps Script returned an unsuccessful response")

          required = ["players", "teams", "fixtures", "results", "auction", "config"]
          missing = [k for k in required if k not in payload]
          if missing:
              raise RuntimeError(
                  "Apps Script response is missing: " + ", ".join(missing)
              )

          source_updated = str(payload.get("sourceUpdatedAt") or payload.get("updatedAt") or "").strip()
          if not source_updated:
              raise RuntimeError("Apps Script did not return sourceUpdatedAt")

          out = pathlib.Path("data")
          out.mkdir(exist_ok=True)

          marker_path = out / "last-update.json"
          existing_marker = {}
          if marker_path.exists():
              try:
                  existing_marker = json.loads(marker_path.read_text(encoding="utf-8"))
              except Exception:
                  existing_marker = {}

          existing_source = str(
              existing_marker.get("sourceUpdatedAt")
              or existing_marker.get("syncedAt")
              or ""
          ).strip()

          def iso_parse(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except Exception:
                  return None

          fetched_dt = iso_parse(source_updated)
          existing_dt = iso_parse(existing_source)

          # Never let a delayed/stale Apps Script response overwrite newer JSON.
          if existing_dt and fetched_dt and fetched_dt < existing_dt:
              print(
                  f"Apps Script data is older than GitHub JSON: fetched={source_updated}, "
                  f"existing={existing_source}. Keeping existing JSON."
              )
              raise SystemExit(0)

          synced_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          for key in required:
              rows = payload.get(key)
              if not isinstance(rows, list):
                  raise RuntimeError(f"{key} is not an array")

              obj = {
                  "updatedAt": source_updated,
                  "sourceUpdatedAt": source_updated,
                  "syncedAt": synced_at,
                  "rows": rows
              }

              if key == "fixtures":
                  obj["headers"] = (
                      list(rows[0].keys())
                      if rows and isinstance(rows[0], dict)
                      else []
                  )

              (out / f"{key}.json").write_text(
                  json.dumps(obj, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

          marker = {
              "success": True,
              "syncedAt": synced_at,
              "sourceUpdatedAt": source_updated,
              "source": "Google Sheets via Apps Script",
              "workflowRun": os.environ.get("GITHUB_RUN_ID", "")
          }

          marker_path.write_text(
              json.dumps(marker, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("JSON sync successful. Source data version:", source_updated)
          PY

      - name: Commit and push updated JSON
        run: |
          set -e

          git config user.name "SRGF Data Sync"
          git config user.email "actions@users.noreply.github.com"

          # Save the newly generated JSON outside the Git working tree.
          rm -rf /tmp/srgf-json
          mkdir -p /tmp/srgf-json
          cp -a data/. /tmp/srgf-json/

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            # Always rebuild the working tree from the latest remote main.
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Put our freshly downloaded JSON back.
            cp -a /tmp/srgf-json/. data/

            git add data/*.json

            if git diff --cached --quiet; then
              echo "No JSON changes to commit."
              exit 0
            fi

            git commit -m "Auto-sync tournament data"

            if git push origin HEAD:main; then
              echo "JSON update pushed successfully."
              exit 0
            fi

            echo "Push rejected because main changed. Refreshing and retrying..."
            git reset --hard origin/main
          done

          echo "Unable to push JSON after 3 attempts."
          exit 1
