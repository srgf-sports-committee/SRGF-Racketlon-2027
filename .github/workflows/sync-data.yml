name: Sync SRGF data

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted schedules are not guaranteed to run every 15 seconds.
    # 5 minutes is the practical public-sync interval used here.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate current tournament data
        env:
          API_URL: "https://script.google.com/macros/s/AKfycbw_KN0QUEsck_ChkjZ3HAS82Xj9aVb9R6UBYJzoh26MSE-ydTJjVjUzn6vFXG3WQlFJsg/exec"
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          from datetime import datetime, timezone

          api = os.environ["API_URL"] + "?action=data&t=" + str(time.time_ns())
          req = urllib.request.Request(api, headers={"User-Agent": "SRGF-Racketlon-Data-Sync/1.0"})
          with urllib.request.urlopen(req, timeout=45) as response:
              if response.status != 200:
                  raise RuntimeError(f"Apps Script HTTP {response.status}")
              payload = json.load(response)

          if not isinstance(payload, dict) or payload.get("ok") is False:
              raise RuntimeError("Apps Script returned an unsuccessful response")

          required = ["players", "teams", "fixtures", "results", "auction", "config"]
          missing = [k for k in required if k not in payload]
          if missing:
              raise RuntimeError("Apps Script response is missing: " + ", ".join(missing))

          out = pathlib.Path("data")
          out.mkdir(exist_ok=True)
          updated = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          for key in required:
              rows = payload.get(key)
              if not isinstance(rows, list):
                  raise RuntimeError(f"{key} is not an array")
              obj = {"updatedAt": updated, "rows": rows}
              if key == "fixtures":
                  obj["headers"] = list(rows[0].keys()) if rows and isinstance(rows[0], dict) else []
              (out / f"{key}.json").write_text(
                  json.dumps(obj, ensure_ascii=False, indent=2), encoding="utf-8"
              )

          # This timestamp means the JSON files were successfully written from
          # a successful Apps Script response. The website uses this file to
          # show freshness and stale-data warnings.
          marker = {
              "success": True,
              "syncedAt": updated,
              "sourceUpdatedAt": payload.get("updatedAt", ""),
              "source": "Google Sheets via Apps Script",
              "workflowRun": os.environ.get("GITHUB_RUN_ID", "")
          }
          (out / "last-update.json").write_text(
              json.dumps(marker, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("JSON sync successful:", updated)
          PY

      - name: Commit updated JSON
        run: |
          git config user.name "SRGF Data Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Auto-sync tournament data"
            git push
          fi
