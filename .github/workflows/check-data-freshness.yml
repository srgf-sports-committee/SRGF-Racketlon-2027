name: Check SRGF data freshness

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled workflows. This check must never make the
    # repository red just because the schedule was delayed or the Sheet has
    # not changed recently.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate last successful JSON marker
        run: |
          python - <<'PY'
          import json, pathlib, datetime, sys

          p = pathlib.Path("data/last-update.json")
          if not p.exists():
              print("ERROR: data/last-update.json does not exist")
              sys.exit(1)

          d = json.loads(p.read_text(encoding="utf-8"))
          if not d.get("success"):
              print("ERROR: last-update.json is not marked successful")
              sys.exit(1)

          source = d.get("sourceUpdatedAt") or d.get("syncedAt")
          if not source:
              print("ERROR: last-update.json has no sourceUpdatedAt/syncedAt")
              sys.exit(1)

          try:
              ts = datetime.datetime.fromisoformat(source.replace("Z", "+00:00"))
          except Exception:
              print("ERROR: last-update.json contains an invalid timestamp")
              sys.exit(1)

          age = (datetime.datetime.now(datetime.timezone.utc) - ts).total_seconds()
          print(f"Latest represented Google Sheet data: {source} ({age:.0f}s ago)")

          # A dataset can legitimately remain unchanged for hours or days.
          # Age alone is therefore NOT a sync failure. The sync workflow itself
          # rejects older source versions and never overwrites newer JSON.
          print("OK: freshness marker is valid. Old data is not overwritten by age alone.")
          PY
