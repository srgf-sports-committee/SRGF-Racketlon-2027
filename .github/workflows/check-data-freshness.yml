name: Check SRGF data freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check last successful JSON sync
        run: |
          python - <<'PY'
          import json, pathlib, datetime, sys

          p = pathlib.Path("data/last-update.json")

          if not p.exists():
              print("WARNING: data/last-update.json does not exist yet.")
              print("The website can still use its existing JSON files.")
              sys.exit(0)

          try:
              d = json.loads(p.read_text(encoding="utf-8"))
          except Exception as e:
              print(f"ERROR: Could not read data/last-update.json: {e}")
              sys.exit(1)

          if not d.get("success") or not d.get("syncedAt"):
              print("WARNING: No successful JSON sync has completed yet.")
              print("This is a warning only; the workflow will not fail.")
              sys.exit(0)

          try:
              synced = datetime.datetime.fromisoformat(
                  d["syncedAt"].replace("Z", "+00:00")
              )
          except Exception as e:
              print(f"ERROR: Invalid syncedAt value: {e}")
              sys.exit(1)

          age = max(0, (datetime.datetime.now(datetime.timezone.utc) - synced).total_seconds())
          minutes = age / 60

          print(f"Last successful JSON sync: {d['syncedAt']}")
          print(f"JSON age: {minutes:.1f} minutes")

          # Stale data is intentionally allowed. The website keeps showing
          # the last good JSON while live data is unavailable.
          if age > 1800:
              print("WARNING: JSON data is more than 30 minutes old.")
              print("The website will continue using the last successful JSON snapshot.")
          elif age > 600:
              print("WARNING: JSON data is more than 10 minutes old.")
          elif age > 300:
              print("NOTICE: JSON data is more than 5 minutes old.")
          else:
              print("OK: JSON data is fresh.")

          # Important: stale data is NOT a workflow failure.
          sys.exit(0)
          PY
