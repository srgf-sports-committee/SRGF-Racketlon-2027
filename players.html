<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRGF Racketlon 2027 — Players</title>
<link rel="stylesheet" href="css/srgf.css">
<style>html.srgf-login-gate-pending main{visibility:hidden}</style>
<script>document.documentElement.classList.add("srgf-login-gate-pending");</script>
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><a href="index.html" style="text-decoration:none"><div class="brand-mark">🏆</div></a><div class="brand">SRGF <span>RACKETLON 2027</span></div></div>
  <nav class="page-nav"></nav>
  <div class="header-actions"><div><div id="status" class="status">Loading…</div><div id="dataFreshness" class="data-freshness">Checking data freshness…</div></div><button id="refreshBtn" class="icon-refresh" title="Refresh">↻</button><div id="authBox" class="auth-box"></div></div>
</header>
<main>
<section id="players">
<h1>Players</h1>
<div class="card">
<div class="players-filters">
  <div class="player-select-wrap">
    <label class="field" for="playerNameButton">Player Name</label>
    <div class="player-combobox" id="playerNameCombo">
      <button type="button" id="playerNameButton" class="player-combobox-display" aria-haspopup="listbox" aria-expanded="false">All Players</button>
      <div id="playerNameDropdown" class="player-dropdown hidden">
        <input id="playerNameSearch" class="player-dropdown-search" type="search" placeholder="Search player name…" autocomplete="off" aria-label="Search player name">
        <div id="playerNameOptions" class="player-dropdown-options" role="listbox"></div>
      </div>
    </div>
  </div>
  <div><label class="field" for="captainNomineeFilter">Captain Nominee</label><select id="captainNomineeFilter"><option value="">All Players</option><option value="yes">Yes</option><option value="no">No</option></select></div>
  <div><label class="field" for="categoryFilter">Category</label><select id="categoryFilter"><option value="">All Categories</option></select></div>
  <div><label class="field" for="sportFilter">Sport</label><select id="sportFilter"><option value="">All Sports</option><option value="badminton">Badminton</option><option value="tt">Table Tennis</option><option value="tennis">Lawn Tennis</option><option value="pickle">Pickle Ball</option></select></div>
  <div class="skill-filter-wrap">
    <label class="field" for="skillFilterButton">Skill</label>
    <button type="button" id="skillFilterButton" class="skill-filter-button" aria-haspopup="true" aria-expanded="false">All Skills</button>
    <div id="skillFilterDropdown" class="skill-filter-dropdown hidden">
      <div id="skillFilterOptions" class="skill-filter-options"></div>
    </div>
  </div>
</div>
<div id="playersResultCount" class="players-result-count" aria-live="polite"></div>
<div class="result-table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Badminton</th><th>TT</th><th>Tennis</th><th>Pickleball</th><th>Team</th></tr></thead>
<tbody id="playersBody"></tbody></table></div>
</div>
<style>
.players-filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end;margin-bottom:12px}
.players-filters>div{min-width:0}.players-result-count{color:var(--muted);font-size:12px;margin:0 0 8px}
.skill-filter-wrap{position:relative}
.skill-filter-button{display:block;width:100%;box-sizing:border-box;min-height:38px;margin:0;padding:10px 30px 10px 10px;text-align:left;font-family:inherit;font-size:14px;font-weight:normal;line-height:normal;color:var(--text);background:rgba(7,31,42,.76);border:1px solid rgba(126,220,219,.25);border-radius:7px;outline:none;cursor:pointer;position:relative}
.skill-filter-button:after{content:"";position:absolute;right:12px;top:50%;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--text);transform:translateY(-25%)}
.skill-filter-button:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(72,224,209,.10)}
.skill-filter-dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:var(--panel,#12352a);border:1px solid var(--line);border-radius:9px;box-shadow:0 14px 30px rgba(0,0,0,.35);padding:8px;max-height:320px;overflow:auto;color:var(--text);text-align:left}
.skill-filter-options{display:grid;gap:2px;width:100%;text-align:left}
.skill-filter-option{display:flex;width:100%;align-items:center;justify-content:flex-start;gap:8px;padding:9px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer;box-sizing:border-box}
.skill-filter-option:hover{background:rgba(217,238,99,.12)}
.skill-filter-option input[type="checkbox"]{display:block;flex:0 0 16px;width:16px!important;height:16px;margin:0;padding:0;accent-color:var(--accent);cursor:pointer}
.skill-filter-option span{display:block;flex:1;min-width:0;text-align:left}
@media(max-width:700px){.players-filters{grid-template-columns:1fr}}
</style>
</section>

</main>
<script src="js/config.js?v=20260929-auth1"></script>
<script src="js/common.js?v=20261012-refresh60"></script>
<script src="js/auth.js?v=20261012-whatsapp3"></script>
<script src="js/login-gate.js?v=20261012-2"></script>
<script src="js/players.js?v=20261012-category2"></script>
</body>
</html>
