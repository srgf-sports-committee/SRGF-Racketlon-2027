<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRGF Racketlon 2027 — Players</title>
<link rel="stylesheet" href="css/srgf.css">
<style>html.srgf-login-gate-pending main{visibility:hidden}</style>
<script>document.documentElement.classList.add("srgf-login-gate-pending");</script>
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><a href="index.html" style="text-decoration:none"><div class="brand-mark">🏆</div></a><div class="brand">SRGF <span>RACKETLON 2027</span></div></div>
  <nav class="page-nav"></nav>
  <div class="header-actions"><div><div id="status" class="status">Loading…</div><div id="dataFreshness" class="data-freshness">Checking data freshness…</div></div><button id="refreshBtn" class="icon-refresh" title="Refresh">↻</button><div id="authBox" class="auth-box"></div></div>
</header>
<main>
<section id="players">
<h1>Players</h1>
<div class="card">
<div class="players-filters">
  <div class="player-select-wrap">
    <label class="field" for="playerNameButton">Player Name</label>
    <div class="player-combobox" id="playerNameCombo">
      <button type="button" id="playerNameButton" class="player-combobox-display" aria-haspopup="listbox" aria-expanded="false">All Players</button>
      <div id="playerNameDropdown" class="player-dropdown hidden">
        <input id="playerNameSearch" class="player-dropdown-search" type="search" placeholder="Search player name…" autocomplete="off" aria-label="Search player name">
        <div id="playerNameOptions" class="player-dropdown-options" role="listbox"></div>
      </div>
    </div>
  </div>
  <div><label class="field" for="sportFilter">Sport</label><select id="sportFilter"><option value="">All Sports</option><option value="badminton">Badminton</option><option value="tt">Table Tennis</option><option value="tennis">Lawn Tennis</option><option value="pickle">Pickle Ball</option></select></div>
  <div><label class="field" for="skillFilter">Skill</label><select id="skillFilter"><option value="">All Skills</option></select></div>
  <div><label class="field" for="categoryFilter">Category</label><select id="categoryFilter"><option value="">All Categories</option></select></div>
</div>
<div id="playersResultCount" class="players-result-count" aria-live="polite"></div>
<div class="result-table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Badminton</th><th>TT</th><th>Tennis</th><th>Pickleball</th><th>Team</th></tr></thead>
<tbody id="playersBody"></tbody></table></div>
</div>
<style>
.players-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end;margin-bottom:12px}
.players-filters>div{min-width:0}.players-result-count{color:var(--muted);font-size:12px;margin:0 0 8px}
@media(max-width:700px){.players-filters{grid-template-columns:1fr}}
</style>
</section>

</main>
<script src="js/config.js?v=20260929-auth1"></script>
<script src="js/common.js?v=20261012-refresh60"></script>
<script src="js/auth.js?v=20261012-whatsapp3"></script>
<script src="js/login-gate.js?v=20261012-2"></script>
<script src="js/players.js?v=20261012-filters1"></script>
</body>
</html>
