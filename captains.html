<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRGF Racketlon 2027 — Captain Directory</title>
<link rel="stylesheet" href="css/srgf.css">
</head>
<body data-page="captains">
<header class="topbar">
  <div class="brand-wrap"><a href="index.html" style="text-decoration:none"><div class="brand-mark">🏆</div></a><div class="brand">SRGF <span>RACKETLON 2027</span></div></div>
  <nav class="page-nav"></nav>
  <div class="header-actions"><div><div id="status" class="status">Checking access…</div></div><button id="refreshBtn" class="icon-refresh" title="Refresh">↻</button><div id="authBox" class="auth-box"></div></div>
</header>
<main>
<section id="captainDirectory">
  <h1>Captain Directory</h1>
  <p class="notice">Team contact list for authorized Captains and Admin.</p>
  <div id="captainAccessMessage" class="card">Checking access…</div>
  <div id="captainTableCard" class="card hidden">
    <div class="captain-filters">
      <div class="captain-filter-field">
        <label for="captainTeamFilter">Team Name</label>
        <select id="captainTeamFilter"><option value="">All Teams</option></select>
      </div>
      <div class="captain-filter-field">
        <label for="captainPlayerFilter">Player Name</label>
        <input id="captainPlayerFilter" type="search" placeholder="Search player name…" autocomplete="off">
      </div>
    </div>
    <p id="captainFilterCount" class="notice" aria-live="polite"></p>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Team Name</th><th>Player Name</th><th>Mobile</th></tr></thead>
        <tbody id="captainPlayersBody"></tbody>
      </table>
    </div>
  </div>
</section>
</main>
<script src="js/config.js?v=20260929-auth1"></script>
<script src="js/common.js?v=20261009-captainnav1"></script>
<script src="js/auth.js?v=20261009-captainrole2"></script>
<script src="js/captains.js?v=20261009-captains2"></script>
</body>
</html>
