<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRGF Racketlon 2027 — Important Links</title>
<link rel="stylesheet" href="css/srgf.css">
<style>
.page-card{max-width:1200px;margin:32px auto;}
.important-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.important-header h1{margin:0 0 6px}
.important-header p{margin:0;color:#b9cbca;font-size:13px}
.download-pdf{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;background:#d9ee63;color:#102017;border:1px solid #c5dd55;border-radius:8px;padding:10px 14px;font-weight:800}
.download-pdf:hover{filter:brightness(1.06)}
.pdf-preview{width:100%;height:min(78vh,850px);min-height:650px;overflow:hidden;border-radius:12px;background:#fff}
.pdf-preview iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.preview-note{margin-top:10px;color:#a9c5cc;font-size:12px}
@media(max-width:700px){.page-card{margin:20px 10px}.pdf-preview{height:75vh;min-height:600px}}
</style>
</head>
<body data-page="importantLinks">
<header class="topbar">
  <div class="brand-wrap" title="Go to Home">
    <div class="brand-mark">🏆</div>
    <div class="brand">SRGF <span>RACKETLON 2027</span></div>
  </div>
  <nav class="page-nav"></nav>
  <div class="header-actions">
    <div id="status" class="status">Public</div>
    <button id="refreshBtn" class="icon-refresh" title="Refresh">↻</button>
    <div id="authBox" class="auth-box"></div>
  </div>
</header>
<main>
<section class="page-card">
  <div class="card">
    <div class="important-header">
      <div>
        <h1>Important Links</h1>
        <p>Read the SRGF Racketlon 2027 rules and guidelines below. Download only if you want a copy.</p>
      </div>
      <a class="download-pdf" href="https://raw.githubusercontent.com/srgf-sports-committee/SRGF-Racketlon-2027/main/SRGF%20Racketlon%202027%20Rules.pdf" download="SRGF Racketlon 2027 Rules.pdf">⬇ Download PDF</a>
    </div>
    <div class="pdf-preview">
      <iframe
        src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://raw.githubusercontent.com/srgf-sports-committee/SRGF-Racketlon-2027/main/SRGF%20Racketlon%202027%20Rules.pdf"
        title="SRGF Racketlon 2027 Rules PDF preview"
        loading="lazy"></iframe>
    </div>
    <div class="preview-note">The PDF is shown here for reading. Use “Download PDF” only when you want to save a copy.</div>
  </div>
</section>
</main>
<script src="js/config.js?v=20260929-auth1"></script>
<script src="js/common.js?v=20261009-captainnav1"></script>
<script src="js/auth.js?v=20261009-captainrole2"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  SRGFAuth.init();
  SRGF.nav("importantLinks");
  document.getElementById("refreshBtn")?.addEventListener("click",()=>location.reload());
});
</script>
</body>
</html>
