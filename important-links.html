<title>SRGF Racketlon 2027 — Important Links</title>
<link rel="stylesheet" href="css/srgf.css">
<style>
.page-card{max-width:1200px;margin:32px auto;}
.important-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.important-header h1{margin:0 0 6px}
.important-header p{margin:0;color:#b9cbca;font-size:13px}
.important-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.video-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:800}.video-link:hover{background:rgba(255,255,255,.12)}.youtube-icon{width:22px;height:22px;display:block;flex:0 0 auto}.download-pdf{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;background:#d9ee63;color:#102017;border:1px solid #c5dd55;border-radius:8px;padding:10px 14px;font-weight:800}
.download-pdf:hover{filter:brightness(1.06)}
.pdf-preview{width:100%;height:min(78vh,850px);min-height:650px;overflow:hidden;border-radius:12px;background:#fff}
.pdf-preview iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.preview-note{margin-top:10px;color:#a9c5cc;font-size:12px}
